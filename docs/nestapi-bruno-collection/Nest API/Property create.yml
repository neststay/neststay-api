info:
  name: Property create
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/properties"
  headers:
    - name: accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "locationId": 1,
        "placeTypeId": 1,
        "nightlyRate": 99.99,
        "name": "Mountain valley resort",
        "description": "Wake up to a beautiful view",
        "numberOfGuests": 6,
        "numberOfBedrooms": 3,
        "numberOfBathrooms": 3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
