info:
  name: User profile
  type: http
  seq: 3

http:
  method: GET
  url: http://{{baseUrl}}/profile
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer  {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
