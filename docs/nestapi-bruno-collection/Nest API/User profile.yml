info:
  name: User profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/profile"
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
