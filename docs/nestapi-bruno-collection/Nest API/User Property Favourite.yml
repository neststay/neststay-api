info:
  name: User Property Favourite
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/properties/favourites?page=1&limit=10"
  headers:
    - name: accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
