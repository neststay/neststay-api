services:
  db:
    image: postgres:18.4-alpine
    container_name: neststay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neststay}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - neststay_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neststay}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neststay

  db-admin:
    image: adminer:5.4.2
    container_name: neststay-db-admin
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DB_DRIVER: pgsql
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - neststay

  search:
    image: typesense/typesense:30.2
    container_name: neststay-search
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: 'true'
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - neststay_search_data:/data
    networks:
      - neststay

  search-admin:
    image: ghcr.io/bfritscher/typesense-dashboard:2.4.8
    container_name: neststay-search-admin
    restart: unless-stopped
    ports:
      - '${TYPESENSE_DASHBOARD_PORT:-8081}:80'
    depends_on:
      - search
    networks:
      - neststay

  redis:
    image: redis:8.8.0-alpine
    container_name: neststay-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - neststay_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neststay

  dozzle:
    image: amir20/dozzle:latest
    container_name: neststay-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '${DOZZLE_PORT:-9999}:8080'
    networks:
      - neststay

networks:
  neststay:
    name: neststay

volumes:
  neststay_db_data:
    name: neststay_db_data
  neststay_search_data:
    name: neststay_search_data
  neststay_redis_data:
    name: neststay_redis_data
